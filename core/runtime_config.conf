#!/bin/bash

############################################
# OPTIMUS⁷ RUNTIME CONFIGURATION
# Central System Runtime Authority
############################################

RUNTIME_VERSION="OPTIMUS7_CORE_RUNTIME_V3"

SYSTEM_NAME="OPTIMUS7_SYSTEM"


############################################
# BASE AUTHORITY
############################################

BASE_PATH="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"


############################################
# CORE COMPONENT PATHS
############################################

CORE_PATH="$BASE_PATH/core"
AUTH_PATH="$BASE_PATH/auth"
GUARDIAN_PATH="$BASE_PATH/guardian"
POLICY_PATH="$BASE_PATH/policy"
VAULT_PATH="$BASE_PATH/vault"
ORCHESTRATOR_PATH="$BASE_PATH/orchestrator"
KEY_MANAGER_PATH="$BASE_PATH/key_manager"


############################################
# INTELLIGENCE PATHS
############################################

SSI_PATH="$BASE_PATH/ssi"
ASI_PATH="$BASE_PATH/asi"


############################################
# SYSTEM SERVICE PATHS
############################################

CONFIG_PATH="$BASE_PATH/config"
AUDIT_PATH="$BASE_PATH/audit"
TELEMETRY_PATH="$BASE_PATH/telemetry"


############################################
# SECURITY STATE AUTHORITY
############################################

STATE_FILE="$CORE_PATH/security_state.conf"

AUDIT_LOG="$AUDIT_PATH/security.log"


############################################
# COMPONENT CONFIGURATION AUTHORITY
############################################

AUTH_CONFIG="$AUTH_PATH/auth_config.conf"

POLICY_FILE="$POLICY_PATH/security_policy.conf"


############################################
# RUNTIME BIND VERIFICATION
############################################

runtime_bind_check() {

    echo "=== OPTIMUS7 RUNTIME BIND CHECK ==="

    echo "SYSTEM=$SYSTEM_NAME"
    echo "VERSION=$RUNTIME_VERSION"
    echo "BASE=$BASE_PATH"

    for PATH_CHECK in \
        "$CORE_PATH" \
        "$AUTH_PATH" \
        "$GUARDIAN_PATH" \
        "$POLICY_PATH" \
        "$VAULT_PATH" \
        "$ORCHESTRATOR_PATH" \
        "$KEY_MANAGER_PATH" \
        "$SSI_PATH" \
        "$ASI_PATH"
    do

        if [ -d "$PATH_CHECK" ]; then
            echo "PATH OK: $PATH_CHECK"
        else
            echo "PATH MISSING: $PATH_CHECK"
        fi

    done


    if [ -f "$STATE_FILE" ]; then
        echo "STATE FILE OK"
    else
        echo "STATE FILE MISSING"
    fi


    if [ -f "$AUDIT_LOG" ]; then
        echo "AUDIT LOG OK"
    else
        echo "AUDIT LOG MISSING"
    fi

}


############################################
# EXPORT RUNTIME AUTHORITY
############################################

export RUNTIME_VERSION
export SYSTEM_NAME
export BASE_PATH

export CORE_PATH
export AUTH_PATH
export GUARDIAN_PATH
export POLICY_PATH
export VAULT_PATH
export ORCHESTRATOR_PATH
export KEY_MANAGER_PATH

export SSI_PATH
export ASI_PATH

export CONFIG_PATH
export AUDIT_PATH
export TELEMETRY_PATH

export STATE_FILE
export AUDIT_LOG

export AUTH_CONFIG
export POLICY_FILE
