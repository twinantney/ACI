name: Build ACI Library

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Lean module name to build (no .lean extension)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - uses: actions/cache@v4
        with:
          path: .lake
          key: Linux-lake-${{ hashFiles('lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build target
        run: |
          echo "::group::Building ${{ inputs.target }}"
          lake build "${{ inputs.target }}"
          echo "::endgroup::"

