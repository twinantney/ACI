name: Build ACI Library

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - uses: actions/cache@v4
        with:
          path: .lake
          key: Linux-lake-${{ hashFiles('lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Verify CI-verified modules exist
        run: |
          cat > /tmp/expected_modules.txt << 'EOF'
          ACIManifold
          AM10
          AWM21
          AWMCore
          AbstractAlgebra
          AcousticsWaves
          AdditiveNumberTheory
          AlgebraicGeometry
          AnalyticNumberTheory
          AntaresCategory
          AtomicMolecularPhysics
          BioinformaticsTheory
          CodingTheory
          Combinatorics
          ComplexAnalysis
          ComputationalComplexity
          CondensedMatterPhysics
          ConformalFieldTheory
          ContactGeometry
          ControlTheory
          ConvexAnalysis
          CryptographyTheory
          DiscreteMathematics
          DynamicalSystems
          EnergyDomain
          ErgodicTheory
          FluidDynamics
          FormalLanguageTheory
          FunctionalAnalysis
          FunctionalEquations
          GeneralRelativity
          Governor
          GraphTheory
          HarmonicAnalysis
          HomologicalAlgebra
          InformationGeometry
          InformationTheoryAdvanced
          IntegralEquations
          LinearAlgebra
          MC2Engine
          Manifold21
          MathematicalBiology
          MathematicalChemistry
          MathematicalEconomics
          Matrix7
          MeasureTheory
          MoruzinLaw
          MotivicCohomology
          N7Spine
          NoncommutativeGeometry
          NuclearPhysics
          NumberTheory
          NumberTheoryCore
          NumericalAnalysis
          Optics
          OptimalControl
          OptimalTransport
          OptimizationTheory
          Optimus7
          Optimus7Quantum
          OrderTheory
          PhysicsCore
          PlasmaPhysics
          ProbabilityTheory
          QuantumCore
          QuantumErrorCorrection
          QuantumFieldTheory
          QuantumGravity
          QuantumInformation
          RepresentationTheory
          SetTheory
          SignalProcessing
          SovereignHamiltonian
          SpineLanguage
          StatisticalMechanics
          StochasticDifferentialEquations
          SymplecticTopology
          Synaptic_Weights
          Thermodynamics
          TopologicalDataAnalysis
          TopologyAdvanced
          TropicalGeometry
          UniversalAlgebra
          VariationalCalculus
          VerifyState
          WaveletAnalysis
          EOF

          sed -i 's/^[[:space:]]*//' /tmp/expected_modules.txt
          sed -i '/^$/d' /tmp/expected_modules.txt
          sort -u /tmp/expected_modules.txt -o /tmp/expected_modules.txt

          ls *.lean 2>/dev/null | sed 's/\.lean$//' | sort -u > /tmp/actual_modules.txt

          echo "Expected CI-verified modules: $(wc -l < /tmp/expected_modules.txt)"
          echo "Actual .lean files on disk: $(wc -l < /tmp/actual_modules.txt)"

          if [ "$(wc -l < /tmp/expected_modules.txt)" -ne 86 ]; then
            echo "::error::CI manifest does not contain exactly 86 modules."
            exit 1
          fi

          if comm -23 /tmp/expected_modules.txt /tmp/actual_modules.txt | grep -q .; then
            echo "::error::A CI-verified module is missing from disk."
            exit 1
          fi

      - name: Build all CI-verified Lean modules
        run: |
          set +e
          FAIL=0
          FAILED_LIST=""
          PASSED_COUNT=0
          TOTAL_COUNT=0

          while IFS= read -r target; do
            [ -n "$target" ] || continue
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            echo "::group::Building $target.lean"
            lake build "$target"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "FAILED: $target.lean"
              FAILED_LIST="$FAILED_LIST $target.lean"
              FAIL=1
            else
              echo "PASSED: $target.lean"
              PASSED_COUNT=$((PASSED_COUNT + 1))
            fi
          done < /tmp/expected_modules.txt

          echo "========================================"
          echo "CI VERIFICATION REPORT"
          echo "========================================"
          echo "Expected: 86"
          echo "Built:    $TOTAL_COUNT"
          echo "Passed:   $PASSED_COUNT"
          echo "Failed:   $((TOTAL_COUNT - PASSED_COUNT))"

          if [ -n "$FAILED_LIST" ]; then
            echo
            echo "FAILED MODULES:"
            printf '%s\n' "$FAILED_LIST"
          fi

          echo "========================================"

          if [ "$TOTAL_COUNT" -ne 86 ]; then
            echo "::error::CI did not process exactly 86 modules."
            exit 1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more of the CI-verified modules failed."
            exit 1
          fi

          echo "ALL CI-VERIFIED MODULES PASSED."

      - name: Build candidate new Lean modules
        if: always(
