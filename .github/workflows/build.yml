name: Build ACI Library

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - uses: actions/cache@v4
        with:
          path: .lake
          key: Linux-lake-${{ hashFiles('lake-manifest.json') }}

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build changed Lean files
        run: |
          set +e
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.lean' | sed 's/\.lean$//')
          if [ -z "$CHANGED" ]; then
            echo "No changed Lean files in this push."
            exit 0
          fi
          FAIL=0
          for target in $CHANGED; do
            echo "::group::Building $target"
            lake build "$target"
            status=$?
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              echo "FAILED: $target"
              FAIL=1
            else
              echo "PASSED: $target"
            fi
          done
          if [ $FAIL -eq 1 ]; then
            exit 1
          fi
